services:
  mom-db:
    image: postgres:16-alpine
    container_name: mom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_moms}
    volumes:
      - mom_pgdata:/var/lib/postgresql/data
    # Host access for local tools only: the app reaches the DB over mom_network
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mom_network

  mom-app:
    build: .
    container_name: mom_app
    restart: unless-stopped
    ports:
      - "5100:5100"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@mom-db:5432/${POSTGRES_DB:-meeting_moms}
    depends_on:
      mom-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5100/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - mom_session:/app/flask_session
      - mom_uploads:/app/uploads
    networks:
      - mom_network

volumes:
  mom_pgdata:
  mom_session:
  mom_uploads:

networks:
  mom_network:
    driver: bridge
