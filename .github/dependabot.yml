# Weekly security and version updates for Python packages and the Docker base images
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # skip releases younger than a week (supply-chain safety)
    open-pull-requests-limit: 5
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7  # skip releases younger than a week (supply-chain safety)
